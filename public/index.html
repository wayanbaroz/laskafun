<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<title>Chat Privat</title>
<style>
:root{--bg:#0f1115;--card:#1a1d24;--me:#2f6df6;--them:#272b35;--tx:#e8eaf0;--mut:#8a90a0}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,sans-serif}
#join{display:flex;flex-direction:column;gap:12px;max-width:380px;margin:0 auto;padding:12vh 20px}
h1{font-size:22px;margin:0 0 4px}
p.s{color:var(--mut);margin:0 0 8px;font-size:14px}
input,select,button{font:inherit;border-radius:12px;border:1px solid #2c303b;background:var(--card);color:var(--tx);padding:13px 14px}
button{background:var(--me);border:0;font-weight:600;cursor:pointer}
#app{display:none;height:100%;flex-direction:column}
header{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;background:var(--card);gap:8px}
#status{font-size:13px;color:var(--mut)}
header select{padding:6px 8px;font-size:13px}
header button{padding:6px 12px;font-size:13px;background:#3a3f4d}
#log{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:6px}
.m{max-width:80%;padding:9px 13px;border-radius:16px;word-wrap:break-word;white-space:pre-wrap}
.me{align-self:flex-end;background:var(--me)}
.them{align-self:flex-start;background:var(--them)}
.sys{align-self:center;color:var(--mut);font-size:12px}
#typing{height:18px;padding:0 16px;font-size:12px;color:var(--mut)}
form{display:flex;gap:8px;padding:10px 12px calc(10px + env(safe-area-inset-bottom));background:var(--card)}
form input{flex:1}
</style>
</head>
<body>
<div id="join">
  <h1>🔒 Chat Privat</h1>
  <p class="s">Tanpa akun, tanpa penyimpanan. Pesan dienkripsi di perangkat. Bagikan kode ruang &amp; kata sandi lewat jalur lain.</p>
  <input id="nick" placeholder="Nama panggilan" maxlength="20" autocomplete="off">
  <input id="room" placeholder="Kode ruang (rahasia)" autocomplete="off">
  <input id="pass" type="password" placeholder="Kata sandi enkripsi" autocomplete="off">
  <button id="go">Masuk</button>
</div>

<div id="app">
  <header>
    <span id="status">Menghubungkan…</span>
    <span>
      <select id="ttl" title="Pesan hilang otomatis">
        <option value="0">Tidak hilang</option>
        <option value="30">30 dtk</option>
        <option value="300" selected>5 mnt</option>
        <option value="3600">1 jam</option>
      </select>
      <button id="clear">Hapus</button>
    </span>
  </header>
  <div id="log"></div>
  <div id="typing"></div>
  <form id="f"><input id="txt" placeholder="Ketik pesan…" autocomplete="off" maxlength="2000"><button>Kirim</button></form>
</div>

<script>
const $ = (id) => document.getElementById(id);
const enc = new TextEncoder(), dec = new TextDecoder();
let key, ws, nick, typingTimer, RID;
const CID = crypto.randomUUID().replace(/-/g, '').slice(0, 16);

const b64 = (buf) => btoa(String.fromCharCode(...new Uint8Array(buf)));
const unb64 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));

async function deriveKey(pass, room) {
  const base = await crypto.subtle.importKey('raw', enc.encode(pass), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey(
    { name: 'PBKDF2', salt: enc.encode('privchat:' + room), iterations: 200000, hash: 'SHA-256' },
    base, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']);
}
async function hashRoom(room) {
  const h = await crypto.subtle.digest('SHA-256', enc.encode('room:' + room));
  return b64(h);
}
async function encrypt(obj) {
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, key, enc.encode(JSON.stringify(obj)));
  return { iv: b64(iv), ct: b64(ct) };
}
async function decrypt(p) {
  const pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: unb64(p.iv) }, key, unb64(p.ct));
  return JSON.parse(dec.decode(pt));
}

function add(text, cls, ttl) {
  const d = document.createElement('div');
  d.className = 'm ' + cls;
  d.textContent = text;
  $('log').appendChild(d);
  $('log').scrollTop = $('log').scrollHeight;
  if (ttl > 0) setTimeout(() => d.remove(), ttl * 1000);
}

$('go').onclick = async () => {
  nick = $('nick').value.trim() || 'Aku';
  const room = $('room').value.trim(), pass = $('pass').value;
  if (!room || !pass) return;
  key = await deriveKey(pass, room);
  const rid = await hashRoom(room); // server tidak pernah melihat kode asli
  $('join').style.display = 'none';
  $('app').style.display = 'flex';
  connect(rid);
};

function post(obj) {
  return fetch('/send?room=' + encodeURIComponent(RID) + '&c=' + CID, { method: 'POST', body: JSON.stringify(obj) });
}

function connect(rid) {
  RID = rid;
  ws = new EventSource('/events?room=' + encodeURIComponent(rid) + '&c=' + CID);
  ws.onerror = () => { $('status').textContent = 'Terputus. Menyambung ulang…'; };
  ws.onmessage = async (e) => {
    const m = JSON.parse(e.data);
    if (m.t === 'joined') $('status').textContent = m.peers ? '🟢 Lawan bicara online' : '⏳ Menunggu lawan bicara…';
    else if (m.t === 'peer') $('status').textContent = m.online ? '🟢 Lawan bicara online' : '⏳ Lawan bicara keluar';
    else if (m.t === 'full') { $('status').textContent = 'Ruang penuh'; }
    else if (m.t === 'msg') {
      try { const o = await decrypt(m); add(o.n + ': ' + o.x, 'them', o.ttl); $('typing').textContent = ''; }
      catch { add('Pesan tidak bisa dibuka (kata sandi beda?)', 'sys'); }
    } else if (m.t === 'typing') {
      $('typing').textContent = 'sedang mengetik…';
      clearTimeout(typingTimer); typingTimer = setTimeout(() => $('typing').textContent = '', 2000);
    }
  };
}

$('f').onsubmit = async (e) => {
  e.preventDefault();
  const x = $('txt').value.trim();
  if (!x) return;
  const ttl = +$('ttl').value;
  const payload = await encrypt({ n: nick, x, ttl });
  post({ t: 'msg', ...payload });
  add(x, 'me', ttl);
  $('txt').value = '';
};
let lastTyping = 0;
$('txt').oninput = () => { if (RID && Date.now() - lastTyping > 1000) { lastTyping = Date.now(); post({ t: 'typing' }); } };
$('clear').onclick = () => { $('log').innerHTML = ''; };
// Tutup tab = semua pesan hilang (tidak ada yang disimpan)
</script>
</body>
</html>
