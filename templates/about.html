{% extends "base.html" %}
{% block content %}
<div class="row">
    <div class="col-md-8 offset-md-2">
        <h1 class="mb-4">Tentang Saya</h1>
        <div class="card mb-4 shadow-sm">
            <div class="card-body">
                <h3>{{ profile.name }}</h3>
                <p class="text-muted">Email: {{ profile.email }}</p>
                <hr>
                <p style="white-space: pre-line;">{{ profile.bio }}</p>
            </div>
        </div>

        <!-- Form Edit Biodata -->
        <div class="card shadow-sm">
            <div class="card-body">
                <h3 class="card-title mb-3">Edit Biodata</h3>
                <form method="POST">
                    <div class="mb-3">
                        <label for="name" class="form-label">Nama</label>
                        <input type="text" class="form-control" id="name" name="name" value="{{ profile.name }}" required>
                    </div>
                    <div class="mb-3">
                        <label for="email" class="form-label">Email</label>
                        <input type="email" class="form-control" id="email" name="email" value="{{ profile.email }}" required>
                    </div>
                    <div class="mb-3">
                        <label for="bio" class="form-label">Bio</label>
                        <textarea class="form-control" id="bio" name="bio" rows="5" required>{{ profile.bio }}</textarea>
                    </div>
                    <button type="submit" class="btn btn-primary">Simpan Perubahan</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
